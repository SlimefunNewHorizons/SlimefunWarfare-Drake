# Las actualizaciones se publican desde DrakesCraft-Labs y se despliegan de forma controlada.
auto-update: false

# Configuración de explosión
explosions:
  # Desactivada en producción hasta que exista una arena destructible dedicada.
  nuclear-enabled: false
  # Las explosiones del addon nunca destruyen bloques; el daño lo filtran las protecciones.
  break-blocks: false
  # Probabilidad de explosión del hormigón armado
  concrete-explode-chance: 10

# Configuraciones de pistola
guns:
  # fuego automático (agacharse)
  autoshoot: true
  # Cuando esta opción está activada, las balas se consumirán del inventario.
  # Cuando esta opción está desactivada, las balas solo se consumirán con la mano izquierda.
  # Si el disparo causa un retraso severo en el servidor, desactive esta opción
  use-bullets-from-inv: true
  # Activar el rango de tiro mínimo puede aumentar el equilibrio
  # Después del cierre, ya no existe un límite mínimo de campo de tiro.
  min-range-on: true
  # Si se debe permitir la explosión de armas energéticas.
  energy-rifle-explosions: false
  # Posibilidad de dejar caer bórax al romper piedra.
  # porcentaje（0-100），puede ser decimal
  borax-drop-chance: 2.0

# configuración del espacio
space:
  # Cuando el atractor de meteoritos atrae meteoritos
  # Posibilidad de atraer meteoros Segnessen (reemplaza a los meteoros de Osmio)）
  # porcentaje（0-100）
  segganesson-chance: 25
  # El intervalo mínimo entre la activación del atractor de meteoritos y la caída del meteoro (unidad: minutos）
  meteor-min-time: 10
  # Tiempo máximo entre la activación del atractor de meteoritos y la caída del meteorito (unidad: minutos）
  meteor-max-time: 30
  # Tiempo de recuperación para la activación del Atractor de Meteoros (unidad: minutos)）
  attractor-cooldown: 1
  # El radio de la distancia de caída del meteoro desde el atractor.
  # El rango de caída del meteorito es un cuadrado.
  # El rango es la mitad de la longitud del lado del cuadrado.
  # Por ejemplo, el valor predeterminado es100Cuando, el área de caída está alrededor200x200área
  meteor-drop-radius: 100

# Configuración de servoarmadura
suits:
  # Si el efecto de partículas azules se mostrará debajo de los pies al volar cuando esté equipado con servoarmadura.
  flight-particles: true
  # Cuando esta opción está habilitada, la forja elemental usará bloques de hierro como bloques de esquina en lugar de bloques de netherita.
  legacy-element-forge: false

# Configuraciones de radar(Esta parte ha sido eliminada.)
radar:
  show-players: true
  show-mobs: true

# Warfare pertenece sólo a la modalidad Slimefun. Se usa lista positiva para no habilitar
# armas por accidente en hubs, arenas, Clásico, SkyBlock u OneBlock.
safety:
  allowed-worlds:
    - world
    - world_nether
    - world_the_end
  denied-message: "&cWarfare is only available in Slimefun worlds."
  show-energy-nets: true
  show-gps: true
  # The distance up/down that the radar can see
  y-range: 30
